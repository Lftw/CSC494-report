# Tool configuration only -- the report's code is imported from scripts/ rather
# than installed, so there is no package to build here.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Notebooks put the sys.path bootstrap above their imports, on purpose.
"notebooks/*.ipynb" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
